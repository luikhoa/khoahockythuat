<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>CyberShield</title>
<style>
  :root {
    --mực:    #0d1226;
    --tấm:    #161d3a;
    --viền:   #26305a;
    --chữ:    #e9edfb;
    --mờ:     #8f9ac4;
    --an:     #56e0a8;
    --xúc:    #ffc861;
    --đe:     #ff7b7b;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 320px;
    padding: 18px 18px 14px;
    background: var(--mực);
    color: var(--chữ);
    font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .nhãn-nhỏ {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mờ);
  }
  h1 {
    margin: 6px 0 2px;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .phụ { color: var(--mờ); font-size: 11.5px; }

  /* Thanh chắn: tỉ lệ nội dung đã che trên tổng số đã quét */
  .thanh {
    display: flex;
    height: 7px;
    margin: 16px 0 6px;
    border-radius: 99px;
    overflow: hidden;
    background: var(--viền);
  }
  .thanh i { display: block; height: 100%; }
  .thanh .an  { background: var(--an); }
  .thanh .xúc { background: var(--xúc); }
  .thanh .đe  { background: var(--đe); }

  .chú { display: flex; gap: 13px; font-size: 11px; color: var(--mờ); }
  .chú span::before {
    content: "";
    display: inline-block;
    width: 7px; height: 7px;
    margin-right: 5px;
    border-radius: 2px;
    vertical-align: middle;
  }
  .chú .l-an::before  { background: var(--an); }
  .chú .l-xúc::before { background: var(--xúc); }
  .chú .l-đe::before  { background: var(--đe); }

  .lưới {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 16px 0 14px;
  }
  .ô {
    padding: 11px 12px;
    border: 1px solid var(--viền);
    border-radius: 10px;
    background: var(--tấm);
  }
  .số { font-size: 21px; font-weight: 640; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ô .nhãn-nhỏ { font-size: 9.5px; letter-spacing: 0.12em; }

  .riêng-tư {
    display: flex;
    gap: 9px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgb(86 224 168 / 0.09);
    border: 1px solid rgb(86 224 168 / 0.22);
    font-size: 11.5px;
    line-height: 1.45;
  }
  .riêng-tư b { color: var(--an); font-weight: 620; }

  footer {
    margin-top: 13px;
    padding-top: 11px;
    border-top: 1px solid var(--viền);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
    color: var(--mờ);
  }
  button {
    padding: 5px 11px;
    border: 1px solid var(--viền);
    border-radius: 7px;
    background: transparent;
    color: var(--mờ);
    font: inherit;
    font-size: 10.5px;
    cursor: pointer;
  }
  button:hover { color: var(--chữ); border-color: var(--mờ); }
  button:focus-visible { outline: 2px solid var(--an); outline-offset: 2px; }
</style>
</head>
<body>
  <p class="nhãn-nhỏ">Hôm nay</p>
  <h1>Tấm chắn đang bật</h1>
  <p class="phụ" id="mô-hình">Đang nạp mô hình…</p>

  <div class="thanh" id="thanh">
    <i class="an"  style="width:100%"></i>
    <i class="xúc" style="width:0"></i>
    <i class="đe"  style="width:0"></i>
  </div>
  <div class="chú">
    <span class="l-an">An toàn</span>
    <span class="l-xúc">Xúc phạm</span>
    <span class="l-đe">Đe doạ</span>
  </div>

  <div class="lưới">
    <div class="ô"><div class="số" id="s-quét">0</div><div class="nhãn-nhỏ">Đoạn đã đọc</div></div>
    <div class="ô"><div class="số" id="s-che">0</div><div class="nhãn-nhỏ">Đã làm mờ</div></div>
    <div class="ô"><div class="số" id="s-link">0</div><div class="nhãn-nhỏ">Link đáng ngờ</div></div>
    <div class="ô"><div class="số" id="s-mở">0</div><div class="nhãn-nhỏ">Bạn chọn xem</div></div>
  </div>

  <div class="riêng-tư">
    <span>🔒</span>
    <p><b>Không có chữ nào rời khỏi máy bạn.</b> Mô hình chạy ngay trong trình duyệt, không gửi gì lên mạng.</p>
  </div>

  <footer>
    <span id="phiên-bản">CyberShield 1.0</span>
    <button id="xoá" type="button">Xoá thống kê</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
